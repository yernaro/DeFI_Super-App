specVersion: 0.0.5
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: AMM
    network: arbitrum-sepolia
    source:
      address: "0x7856f87A661Bdb6FA2B11fc6232D56311D8d4C47"
      abi: AMM
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Pool
        - Swap
        - LiquidityEvent
        - Token
      abis:
        - name: AMM
          file: AMM\AMM.json
      eventHandlers:
        - event: LiquidityAdded(indexed address,uint256,uint256,uint256)
          handler: handleLiquidityAdded
        - event: LiquidityRemoved(indexed address,uint256,uint256,uint256)
          handler: handleLiquidityRemoved
        - event: Swap(indexed address,uint256,uint256,bool,indexed address)
          handler: handleSwap
        - event: Sync(uint112,uint112)
          handler: handleSync
      file: AMM\AMM.wasm
  - kind: ethereum
    name: LendingPool
    network: arbitrum-sepolia
    source:
      address: "0x7285F770Ed861F22dCa4C7429FCe9B3b30407b96"
      abi: LendingPool
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - LendingPosition
        - Liquidation
        - InterestAccrual
      abis:
        - name: LendingPool
          file: LendingPool\LendingPool.json
      eventHandlers:
        - event: CollateralDeposited(indexed address,uint256)
          handler: handleCollateralDeposited
        - event: CollateralWithdrawn(indexed address,uint256)
          handler: handleCollateralWithdrawn
        - event: Borrowed(indexed address,uint256)
          handler: handleBorrowed
        - event: Repaid(indexed address,uint256,uint256)
          handler: handleRepaid
        - event: Liquidated(indexed address,indexed address,uint256,uint256)
          handler: handleLiquidated
      file: LendingPool\LendingPool.wasm
  - kind: ethereum
    name: YieldVault
    network: arbitrum-sepolia
    source:
      address: "0x0479722bF65A1fE9d4070263Da205f320eAf2c4a"
      abi: YieldVault
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - VaultDeposit
        - VaultWithdraw
        - YieldHarvest
      abis:
        - name: YieldVault
          file: YieldVault\YieldVault.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleVaultDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleVaultWithdraw
        - event: YieldHarvested(uint256,uint256,address)
          handler: handleYieldHarvested
      file: YieldVault\YieldVault.wasm
  - kind: ethereum
    name: DeFiGovernor
    network: arbitrum-sepolia
    source:
      address: "0x9CF86FDC9B4D8b74F71cc3a815AaC9f5Ca758dD7"
      abi: DeFiGovernor
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Proposal
        - Vote
        - GovernanceStats
      abis:
        - name: DeFiGovernor
          file: DeFiGovernor\DeFiGovernor.json
      eventHandlers:
        - event: ProposalCreated(uint256,address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: handleProposalCreated
        - event: VoteCast(indexed address,uint256,uint8,uint256,string)
          handler: handleVoteCast
        - event: ProposalQueued(uint256,uint256)
          handler: handleProposalQueued
        - event: ProposalExecuted(uint256)
          handler: handleProposalExecuted
        - event: ProposalCanceled(uint256)
          handler: handleProposalCanceled
      file: DeFiGovernor\DeFiGovernor.wasm
