# ─────────────────────────────────────────────────────────────────────────────
# DeFi Super-App Subgraph Schema
# Entities: Pool, Swap, LiquidityEvent, LendingPosition, Liquidation,
#           VaultDeposit, VaultWithdraw, YieldHarvest, Proposal, Vote,
#           GovernanceStats, ProtocolDayData
# ─────────────────────────────────────────────────────────────────────────────

# ── AMM ───────────────────────────────────────────────────────────────────────

"""
Represents the AMM liquidity pool state at the latest sync.
"""
type Pool @entity {
  id: ID!                         # pair contract address
  tokenA: Bytes!
  tokenB: Bytes!
  reserveA: BigDecimal!
  reserveB: BigDecimal!
  totalLPSupply: BigDecimal!
  totalVolumeA: BigDecimal!
  totalVolumeB: BigDecimal!
  txCount: BigInt!
  createdAt: BigInt!
  updatedAt: BigInt!
  swaps: [Swap!]! @derivedFrom(field: "pool")
  liquidityEvents: [LiquidityEvent!]! @derivedFrom(field: "pool")
}

"""
Individual swap event.
"""
type Swap @entity {
  id: ID!                         # txHash-logIndex
  pool: Pool!
  sender: Bytes!
  recipient: Bytes!
  amountIn: BigDecimal!
  amountOut: BigDecimal!
  aToB: Boolean!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

"""
Add or remove liquidity event.
"""
type LiquidityEvent @entity {
  id: ID!
  pool: Pool!
  provider: Bytes!
  amountA: BigDecimal!
  amountB: BigDecimal!
  lpAmount: BigDecimal!
  isAdd: Boolean!                 # true = add, false = remove
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

# ── Lending ───────────────────────────────────────────────────────────────────

"""
Per-user lending position (collateral + debt).
"""
type LendingPosition @entity {
  id: ID!                         # user address
  user: Bytes!
  collateralAmount: BigDecimal!
  debtAmount: BigDecimal!
  state: String!                  # "None" | "Active" | "Liquidated"
  deposits: [CollateralEvent!]! @derivedFrom(field: "position")
  borrows: [BorrowEvent!]!       @derivedFrom(field: "position")
  repayments: [RepayEvent!]!     @derivedFrom(field: "position")
  liquidations: [Liquidation!]!  @derivedFrom(field: "borrower")
  createdAt: BigInt!
  updatedAt: BigInt!
}

type CollateralEvent @entity {
  id: ID!
  position: LendingPosition!
  amount: BigDecimal!
  isDeposit: Boolean!
  timestamp: BigInt!
  txHash: Bytes!
}

type BorrowEvent @entity {
  id: ID!
  position: LendingPosition!
  amount: BigDecimal!
  timestamp: BigInt!
  txHash: Bytes!
}

type RepayEvent @entity {
  id: ID!
  position: LendingPosition!
  amount: BigDecimal!
  interest: BigDecimal!
  timestamp: BigInt!
  txHash: Bytes!
}

"""
Liquidation event — records who was liquidated, by whom, and amounts.
"""
type Liquidation @entity {
  id: ID!
  liquidator: Bytes!
  borrower: LendingPosition!
  debtRepaid: BigDecimal!
  collateralSeized: BigDecimal!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

# ── Vault ─────────────────────────────────────────────────────────────────────

type VaultDeposit @entity {
  id: ID!
  caller: Bytes!
  owner: Bytes!
  assets: BigDecimal!
  shares: BigDecimal!
  timestamp: BigInt!
  txHash: Bytes!
}

type VaultWithdraw @entity {
  id: ID!
  caller: Bytes!
  receiver: Bytes!
  owner: Bytes!
  assets: BigDecimal!
  shares: BigDecimal!
  timestamp: BigInt!
  txHash: Bytes!
}

type YieldHarvest @entity {
  id: ID!
  grossAmount: BigDecimal!
  feeAmount: BigDecimal!
  feeRecipient: Bytes!
  timestamp: BigInt!
  txHash: Bytes!
}

# ── Governance ────────────────────────────────────────────────────────────────

"""
On-chain governance proposal with full lifecycle state.
"""
type Proposal @entity {
  id: ID!                         # proposalId
  proposer: Bytes!
  description: String!
  startBlock: BigInt!
  endBlock: BigInt!
  # state: Pending→Active→Succeeded/Defeated→Queued→Executed/Canceled
  state: String!
  forVotes: BigDecimal!
  againstVotes: BigDecimal!
  abstainVotes: BigDecimal!
  eta: BigInt                     # queued eta (seconds)
  executedAt: BigInt
  canceledAt: BigInt
  createdAt: BigInt!
  votes: [Vote!]! @derivedFrom(field: "proposal")
}

"""
Individual vote cast on a proposal.
"""
type Vote @entity {
  id: ID!                         # proposalId-voter
  proposal: Proposal!
  voter: Bytes!
  support: Int!                   # 0=Against,1=For,2=Abstain
  weight: BigDecimal!
  reason: String
  timestamp: BigInt!
  txHash: Bytes!
}

"""
Aggregated governance stats (singleton, id="governance").
"""
type GovernanceStats @entity {
  id: ID!                         # "governance"
  totalProposals: BigInt!
  totalVotesCast: BigInt!
  totalVotingPower: BigDecimal!
  uniqueVoters: BigInt!
}

# ── Protocol-level daily snapshots ────────────────────────────────────────────

type ProtocolDayData @entity {
  id: ID!                         # timestamp / 86400
  date: Int!
  dailyVolumeA: BigDecimal!
  dailyVolumeB: BigDecimal!
  dailySwaps: BigInt!
  dailyLiquidations: BigInt!
  dailyVaultDeposits: BigDecimal!
  dailyYieldHarvested: BigDecimal!
}
