[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
fuzz = { runs = 256 }
invariant = { runs = 64, depth = 32 }

[profile.ci]
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 64 }

[rpc_endpoints]
arbitrum_sepolia  = "${ARBITRUM_SEPOLIA_RPC}"
optimism_sepolia  = "${OPTIMISM_SEPOLIA_RPC}"
base_sepolia      = "${BASE_SEPOLIA_RPC}"
mainnet           = "${MAINNET_RPC}"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api" }
optimism_sepolia = { key = "${OP_ETHERSCAN_API_KEY}", url = "https://api-sepolia-optimism.etherscan.io/api" }
base_sepolia     = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }

[fmt]
line_length = 120
tab_width   = 4
bracket_spacing = true
