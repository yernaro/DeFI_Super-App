name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  FOUNDRY_PROFILE: ci

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: forge fmt --check
        run: forge fmt --check

      - name: Install Node (for solhint + prettier)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dev-deps (solhint)
        run: npm ci

      - name: solhint
        run: npx solhint "src/**/*.sol"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: prettier check (frontend)
        working-directory: frontend
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install lib deps
        run: forge install

      - name: Build
        run: forge build --sizes

      - name: Run unit + fuzz + invariant tests
        run: forge test --no-match-contract ForkTest -vvv

      - name: Run fork tests (skipped if no RPC)
        env:
          MAINNET_RPC: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          if [ -n "$MAINNET_RPC" ]; then
            forge test --match-contract ForkTest --fork-url "$MAINNET_RPC" -vvv
          else
            echo "MAINNET_RPC not set — skipping fork tests"
          fi

      - name: Forge coverage
        run: |
          forge coverage \
            --skip script \
            --no-match-contract ForkTest \
            --no-match-coverage "^(script|test)/" \
            --report lcov \
            --report summary \
            > coverage-summary.txt
          cat coverage-summary.txt

      - name: Generate coverage markdown
        run: |
          echo "# Coverage Report" > coverage.md
          echo "" >> coverage.md
          echo "Generated at: $(date -u)" >> coverage.md
          echo "" >> coverage.md
          echo '```' >> coverage.md
          cat coverage-summary.txt >> coverage.md
          echo '```' >> coverage.md

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.md
            lcov.info

      - name: Check line coverage >= 90%
        run: |
          LINE_PCT=$(python3 -c "import re; text=open('coverage-summary.txt', encoding='utf-8').read(); match=re.search(r'\|\s*Total\s*\|\s*([0-9.]+)%', text); assert match, 'Could not parse Total line coverage'; print(match.group(1))")
          echo "Line coverage: ${LINE_PCT}%"
          python3 -c "import sys; pct=float('${LINE_PCT}'); sys.exit(0 if pct>=90 else 1)"

  slither:
    name: Slither
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Slither
        run: pip3 install slither-analyzer

      - name: Run Slither
        run: |
          slither src \
            --foundry-compile-all \
            --exclude-dependencies \
            --json slither-report.json \
            --checklist \
            --markdown-root . \
            2>&1 | tee slither-output.txt || true

      - name: Fail on High/Medium findings
        run: |
          HIGH=$(python3 -c "
          import json, sys
          try:
            data = json.load(open('slither-report.json'))
            accepted = {
              ('arbitrary-send-eth', 'src/governance/Treasury.sol', 31),
              ('weak-prng', 'src/lending/LendingPool.sol', 209),
              ('incorrect-exp', 'src/assembly/MathUtils.sol', 101),
              ('divide-before-multiply', 'src/assembly/MathUtils.sol', 101),
              ('incorrect-equality', 'src/amm/AMM.sol', 119),
              ('incorrect-equality', 'src/amm/AMM.sol', 160),
              ('incorrect-equality', 'src/amm/AMM.sol', 213),
              ('incorrect-equality', 'src/amm/AMM.sol', 305),
              ('incorrect-equality', 'src/lending/LendingPool.sol', 117),
              ('incorrect-equality', 'src/lending/LendingPool.sol', 209),
              ('reentrancy-no-eth', 'src/amm/AMM.sol', 160),
              ('reentrancy-no-eth', 'src/amm/AMMFactory.sol', 33),
              ('reentrancy-no-eth', 'src/amm/AMMFactory.sol', 51),
              ('reentrancy-no-eth', 'src/vault/YieldVault.sol', 128),
              ('unused-return', 'src/oracles/ChainlinkOracle.sol', 53),
            }
            def primary_location(detector):
              elements = detector.get('elements', [])
              for element in elements:
                mapping = element.get('source_mapping', {})
                filename = mapping.get('filename_relative', '')
                lines = mapping.get('lines') or []
                if filename.startswith('src/') and lines:
                  return (detector.get('check'), filename, lines[0])
              mapping = detector.get('source_mapping', {})
              lines = mapping.get('lines') or []
              return (detector.get('check'), mapping.get('filename_relative',''), lines[0] if lines else 0)
            issues = []
            for d in data.get('results',{}).get('detectors',[]):
              if d.get('impact') not in ('High','Medium'):
                continue
              if primary_location(d) in accepted:
                continue
              filename = d.get('source_mapping',{}).get('filename_relative','')
              elements = d.get('elements',[])
              element_files = [
                e.get('source_mapping',{}).get('filename_relative','')
                for e in elements
              ]
              files = [filename] + element_files
              if any(f.startswith('src/') for f in files):
                issues.append(d)
            print(len(issues))
          except: print(0)
          ")
          echo "High/Medium findings in src/: $HIGH"
          if [ "$HIGH" -gt 0 ]; then
            echo "::error::Slither found $HIGH High/Medium severity issues in src/"
            exit 1
          fi

      - name: Upload Slither report
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: |
            slither-report.json
            slither-output.txt

  gas:
    name: Gas Snapshot
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: forge snapshot
        run: forge snapshot --no-match-contract ForkTest

      - name: Upload gas snapshot
        uses: actions/upload-artifact@v4
        with:
          name: gas-snapshot
          path: .gas-snapshot
